{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block bodyclass %}center{% endblock %}
{% block body %}
<main class="login card flush">
  <div class="login-band"><span class="login-logo">{% include "_logo_white.svg" %}</span></div>
  <div class="login-body">
  <h1>Administrator login</h1>
  {% if error %}<p class="alert danger" role="alert">{{ error }}</p>{% endif %}
  <form method="post" autocomplete="on">
    <input type="hidden" name="_csrf" value="{{ csrf() }}">
    <label>User name
      <input name="username" type="text" autocomplete="username" required autofocus maxlength="64">
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required maxlength="256">
    </label>
    <button class="btn primary block" type="submit">Log in</button>
  </form>
  <p class="center-text"><a href="{{ url_for('public') }}">← Back to the home page</a></p>
  </div>
</main>
{% endblock %}
